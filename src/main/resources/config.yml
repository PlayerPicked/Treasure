# ------------------------------------------------------------------
#  Treasure configuration
#  All player-facing texts live in messages.yml, menu layouts in guis.yml.
#  Treasures themselves are stored in treasures.yml (edit them in-game
#  with /treasure setup).
# ------------------------------------------------------------------

# Names of the main command. The first one is the main name.
# Changes need a server restart.
command-aliases:
  - "treasure"
  - "treasurechest"

loot:
  # true: loot is spread over random slots; false: it fills the inventory from the first slot.
  place-randomly: true

# The advancement-style popup shown when a player opens a treasure.
# Its text is "treasure.toast-title" in messages.yml.
toast:
  enabled: true
  material: "CHEST"

# Holograms are text displays above the treasure, rendered separately for
# every nearby player, so per-player values like <time-left> work.
hologram:
  # How the text turns towards players: CENTER, FIXED, VERTICAL or HORIZONTAL.
  billboard: "CENTER"
  text-shadow: true
  # TRANSPARENT, DEFAULT (the vanilla grey box) or a hex color: "#64FF4F", or with alpha "#A064FF4F".
  background: "TRANSPARENT"
  # Players closer than this many blocks see the hologram.
  view-distance: 32
  # How often the text is refreshed (20 ticks = 1 second).
  update-interval-ticks: 20

# The particle used by each effect shape. Only particles that need no extra
# data work here (e.g. flame, end_rod, crit, heart, witch, bubble).
particles:
  helix: "crit"
  heart: "flame"
  pulsar: "witch"
  sphere: "end_rod"
  tornado: "bubble"
  phoenix: "end_rod"
  spiral: "end_rod"

# The compass that points players to the nearest treasure in their world
# while they hold it. Its name and lore are in messages.yml under "tracker.item".
tracker:
  enabled: true
  material: "COMPASS"

# Chat input used by the setup menu (names, permissions, cooldowns, ...).
setup:
  # Seconds before an unanswered question expires.
  prompt-timeout-seconds: 30
  # Typing this word cancels the question.
  cancel-word: "cancel"

# Sounds use vanilla sound keys. Leave "sound" empty to play nothing.
sounds:
  open:
    sound: "minecraft:block.chest.open"
    volume: 0.5
    pitch: 1.0
  close:
    sound: "minecraft:block.chest.close"
    volume: 0.5
    pitch: 1.0
  denied:
    sound: "minecraft:entity.villager.no"
    volume: 0.5
    pitch: 1.0
  pickup:
    sound: "minecraft:entity.item.pickup"
    volume: 0.5
    pitch: 1.2
  click:
    sound: "minecraft:ui.button.click"
    volume: 0.5
    pitch: 1.0
  saved:
    sound: "minecraft:entity.experience_orb.pickup"
    volume: 0.5
    pitch: 1.0
  deleted:
    sound: "minecraft:entity.item.break"
    volume: 0.5
    pitch: 0.5

# Where per-player cooldowns are stored. Changes need a server restart.
#   h2    - a local file in the plugin folder, nothing to set up
#   mysql - share cooldowns between servers using the same treasures
database:
  type: "h2"
  mysql:
    host: "localhost"
    port: 3306
    database: "treasure"
    username: "root"
    password: "change-me"
    pool-size: 10

# Do not change this; it is used to add new options to your file automatically.
version: "1"
