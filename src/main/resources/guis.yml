# ------------------------------------------------------------------
#  Treasure menus
#
#  Every menu has a title (plain MiniMessage, no placeholders), a number of
#  rows (1-6) and items. Item keys that a menu knows (listed above each menu)
#  are buttons; any other key is plain decoration.
#
#  Item options:
#    material           Bukkit material name (required)
#    slot               4 | 0,8 | 10-16,19-25 | border | corners | top | bottom
#                       | left | right | fill | grid:<columns>x<rows>@<first slot>
#    name, lore         MiniMessage text; may use the menu's placeholders
#    amount             stack size (default 1)
#    item-model         resource pack item model, e.g. "mypack:menu/back"
#    custom-model-data  resource pack custom model data number
#    glow               true to add the enchantment glint
#    priority           when items share a slot, the higher priority wins
#    variants           per-state overrides of the options above
#
#  A lore line is hidden when one of its placeholders has no value.
#  Empty '' lines are always kept.
#
#  Treasure placeholders (overview "treasure" item, editor and hologram editor):
#    <id>, <name>, <location>, <permission>, <cooldown>, <size>, <loot-count>,
#    <pushback>, <pushback-strength>, <hologram>, <hologram-lines>,
#    <hologram-height>, <particles>, <particle-shape>
# ------------------------------------------------------------------

# Buttons: previous-page, next-page, create, close
# Placeholders everywhere: <count>, <page>, <pages>
# The "treasure" item is drawn once per treasure in content-slots and has the treasure placeholders.
# Treasure clicks: left = edit, right = preview loot, drop key (Q) = delete
overview:
  title: "<dark_gray><bold>TREASURE CHESTS"
  rows: 6
  content-slots: "0-44"
  items:
    bottom-bar:
      material: GRAY_STAINED_GLASS_PANE
      slot: "45-53"
      name: " "
      priority: -1
    treasure:
      material: BARREL
      name: "<name>"
      lore:
        - ""
        - "<dark_gray><bold>|</bold> <gray>ID <dark_gray>» <white><id>"
        - "<dark_gray><bold>|</bold> <gray>Location <dark_gray>» <location>"
        - "<dark_gray><bold>|</bold> <gray>Cooldown <dark_gray>» <cooldown>"
        - "<dark_gray><bold>|</bold> <gray>Permission <dark_gray>» <permission>"
        - "<dark_gray><bold>|</bold> <gray>Size <dark_gray>» <green><size>"
        - "<dark_gray><bold>|</bold> <gray>Loot <dark_gray>» <green><loot-count> item(s)"
        - "<dark_gray><bold>|</bold> <gray>Pushback <dark_gray>» <pushback>"
        - "<dark_gray><bold>|</bold> <gray>Hologram <dark_gray>» <hologram>"
        - "<dark_gray><bold>|</bold> <gray>Particles <dark_gray>» <particles> <dark_gray>(<gold><particle-shape></gold>)"
        - ""
        - "<dark_gray><bold>|</bold> <gray>ʟᴇꜰᴛ ᴄʟɪᴄᴋ <dark_gray>» <white>ᴇᴅɪᴛ"
        - "<dark_gray><bold>|</bold> <gray>ʀɪɢʜᴛ ᴄʟɪᴄᴋ <dark_gray>» <white>ᴘʀᴇᴠɪᴇᴡ ʟᴏᴏᴛ"
        - "<dark_gray><bold>|</bold> <gray>ǫ ᴋᴇʏ <dark_gray>» <red>ᴅᴇʟᴇᴛᴇ"
        - ""
    previous-page:
      material: ARROW
      slot: 48
      name: "<gray>Previous page"
      lore:
        - "<dark_gray>Page <page>/<pages>"
    close:
      material: BARRIER
      slot: 49
      name: "<red>Close"
    next-page:
      material: ARROW
      slot: 50
      name: "<gray>Next page"
      lore:
        - "<dark_gray>Page <page>/<pages>"
    create:
      material: NETHER_STAR
      slot: 53
      name: "<gold><bold>CREATE TREASURE"
      lore:
        - ""
        - "<dark_gray><bold>|</bold> <gray>Treasures: <white><count>"
        - ""
        - "<dark_gray><bold>|</bold> <gray>ʟᴇꜰᴛ ᴄʟɪᴄᴋ <dark_gray>» <white>ᴄʀᴇᴀᴛᴇ ɴᴇᴡ"
        - ""

# Buttons: name, permission, cooldown, size, location, pushback, hologram, particles, loot, back
#   pushback:  left = set strength, drop key (Q) = toggle
#   hologram:  left = edit lines, drop key (Q) = toggle
#   particles: left = next shape, right = previous shape, drop key (Q) = toggle
# "pushback", "hologram" and "particles" have "on"/"off" variants.
# Placeholders everywhere: the treasure placeholders
editor:
  title: "<dark_gray><bold>EDIT TREASURE"
  rows: 6
  items:
    filler:
      material: BLACK_STAINED_GLASS_PANE
      slot: fill
      name: " "
    info:
      material: BARREL
      slot: 4
      name: "<name>"
      lore:
        - "<dark_gray>ID: <id>"
    name:
      material: NAME_TAG
      slot: 10
      name: "<yellow><bold>SET NAME"
      lore:
        - ""
        - "<dark_gray><bold>|</bold> <gray>Current <dark_gray>» </dark_gray><name>"
        - ""
        - "<dark_gray><bold>|</bold> <gray>ʟᴇꜰᴛ ᴄʟɪᴄᴋ <dark_gray>» <white>ᴇᴅɪᴛ"
        - ""
    permission:
      material: TRIPWIRE_HOOK
      slot: 12
      name: "<aqua><bold>SET PERMISSION"
      lore:
        - ""
        - "<dark_gray><bold>|</bold> <gray>Current <dark_gray>» <permission>"
        - ""
        - "<dark_gray><bold>|</bold> <gray>ʟᴇꜰᴛ ᴄʟɪᴄᴋ <dark_gray>» <white>ᴇᴅɪᴛ"
        - ""
    cooldown:
      material: CLOCK
      slot: 14
      name: "<red><bold>SET COOLDOWN"
      lore:
        - ""
        - "<dark_gray><bold>|</bold> <gray>Current <dark_gray>» <cooldown>"
        - ""
        - "<dark_gray><bold>|</bold> <gray>ʟᴇꜰᴛ ᴄʟɪᴄᴋ <dark_gray>» <white>ᴇᴅɪᴛ"
        - ""
    size:
      material: BOWL
      slot: 16
      name: "<gold><bold>SET SIZE"
      lore:
        - ""
        - "<dark_gray><bold>|</bold> <gray>Current <dark_gray>» <green><size> slots"
        - ""
        - "<dark_gray><bold>|</bold> <gray>ʟᴇꜰᴛ ᴄʟɪᴄᴋ <dark_gray>» <white>ᴇᴅɪᴛ"
        - ""
    particles:
      slot: 20
      name: "<gold><bold>SET EFFECTS"
      lore:
        - ""
        - "<dark_gray><bold>|</bold> <gray>Enabled <dark_gray>» <particles>"
        - "<dark_gray><bold>|</bold> <gray>Shape <dark_gray>» <gold><particle-shape>"
        - ""
        - "<dark_gray><bold>|</bold> <gray>ʟᴇꜰᴛ ᴄʟɪᴄᴋ <dark_gray>» <white>ɴᴇxᴛ ꜱʜᴀᴘᴇ"
        - "<dark_gray><bold>|</bold> <gray>ʀɪɢʜᴛ ᴄʟɪᴄᴋ <dark_gray>» <white>ᴘʀᴇᴠɪᴏᴜꜱ ꜱʜᴀᴘᴇ"
        - "<dark_gray><bold>|</bold> <gray>ǫ ᴋᴇʏ <dark_gray>» <white>ᴛᴏɢɢʟᴇ"
        - ""
      variants:
        "on": { material: TOTEM_OF_UNDYING, glow: true }
        "off": { material: TOTEM_OF_UNDYING }
    loot:
      material: CHEST
      slot: 22
      name: "<yellow><bold>SET LOOT"
      lore:
        - ""
        - "<dark_gray><bold>|</bold> <gray>Items <dark_gray>» <green><loot-count>"
        - "<dark_gray><bold>|</bold> <gray>Close the inventory to save."
        - ""
        - "<dark_gray><bold>|</bold> <gray>ʟᴇꜰᴛ ᴄʟɪᴄᴋ <dark_gray>» <white>ᴇᴅɪᴛ"
        - ""
    location:
      material: SCAFFOLDING
      slot: 29
      name: "<green><bold>SET LOCATION"
      lore:
        - ""
        - "<dark_gray><bold>|</bold> <gray>Current <dark_gray>» <location>"
        - ""
        - "<dark_gray><bold>|</bold> <gray>ʟᴇꜰᴛ ᴄʟɪᴄᴋ <dark_gray>» <white>ʙʀᴇᴀᴋ ᴀ ʙʟᴏᴄᴋ"
        - ""
    pushback:
      slot: 31
      name: "<yellow><bold>SET PUSHBACK"
      lore:
        - ""
        - "<dark_gray><bold>|</bold> <gray>Enabled <dark_gray>» <pushback>"
        - "<dark_gray><bold>|</bold> <gray>Strength <dark_gray>» <green><pushback-strength>"
        - ""
        - "<dark_gray><bold>|</bold> <gray>ʟᴇꜰᴛ ᴄʟɪᴄᴋ <dark_gray>» <white>ꜱᴇᴛ ꜱᴛʀᴇɴɢᴛʜ"
        - "<dark_gray><bold>|</bold> <gray>ǫ ᴋᴇʏ <dark_gray>» <white>ᴛᴏɢɢʟᴇ"
        - ""
      variants:
        "on": { material: SLIME_BALL }
        "off": { material: MAGMA_CREAM }
    hologram:
      slot: 33
      name: "<light_purple><bold>SET HOLOGRAM"
      lore:
        - ""
        - "<dark_gray><bold>|</bold> <gray>Enabled <dark_gray>» <hologram>"
        - "<dark_gray><bold>|</bold> <gray>Lines <dark_gray>» <green><hologram-lines>"
        - ""
        - "<dark_gray><bold>|</bold> <gray>ʟᴇꜰᴛ ᴄʟɪᴄᴋ <dark_gray>» <white>ᴇᴅɪᴛ ʟɪɴᴇꜱ"
        - "<dark_gray><bold>|</bold> <gray>ǫ ᴋᴇʏ <dark_gray>» <white>ᴛᴏɢɢʟᴇ"
        - ""
      variants:
        "on": { material: SHULKER_SHELL, glow: true }
        "off": { material: SHULKER_SHELL }
    back:
      material: ARROW
      slot: 49
      name: "<gray>Back"

# Buttons: previous-page, next-page, add-line, height, toggle, back
#   height: left = raise by 0.1, right = lower by 0.1
#   "toggle" has "on"/"off" variants.
# Placeholders everywhere: the treasure placeholders, <page>, <pages>
# The "line" item is drawn once per hologram line in content-slots and also has:
#   <number> = line number, <line> = rendered line, <raw> = the line as typed
# Line clicks: left = edit, drop key (Q) = remove
hologram-editor:
  title: "<dark_gray><bold>EDIT HOLOGRAM"
  rows: 6
  content-slots: "0-44"
  items:
    bottom-bar:
      material: GRAY_STAINED_GLASS_PANE
      slot: "45-53"
      name: " "
      priority: -1
    line:
      material: PAPER
      name: "<line>"
      lore:
        - ""
        - "<dark_gray><bold>|</bold> <gray>Line <white><number>"
        - "<dark_gray><bold>|</bold> <gray>Raw <dark_gray>» <white><raw>"
        - ""
        - "<dark_gray><bold>|</bold> <gray>ʟᴇꜰᴛ ᴄʟɪᴄᴋ <dark_gray>» <white>ᴇᴅɪᴛ ʟɪɴᴇ"
        - "<dark_gray><bold>|</bold> <gray>ǫ ᴋᴇʏ <dark_gray>» <red>ʀᴇᴍᴏᴠᴇ ʟɪɴᴇ"
        - ""
    previous-page:
      material: ARROW
      slot: 45
      name: "<gray>Previous page"
      lore:
        - "<dark_gray>Page <page>/<pages>"
    toggle:
      slot: 47
      name: "<light_purple><bold>HOLOGRAM"
      lore:
        - ""
        - "<dark_gray><bold>|</bold> <gray>Enabled <dark_gray>» <hologram>"
        - ""
        - "<dark_gray><bold>|</bold> <gray>ʟᴇꜰᴛ ᴄʟɪᴄᴋ <dark_gray>» <white>ᴛᴏɢɢʟᴇ"
        - ""
      variants:
        "on": { material: LIME_DYE }
        "off": { material: GRAY_DYE }
    height:
      material: IRON_NUGGET
      slot: 48
      name: "<aqua><bold>HEIGHT"
      lore:
        - ""
        - "<dark_gray><bold>|</bold> <gray>Current <dark_gray>» <green><hologram-height>"
        - ""
        - "<dark_gray><bold>|</bold> <gray>ʟᴇꜰᴛ ᴄʟɪᴄᴋ <dark_gray>» <green>+0.1"
        - "<dark_gray><bold>|</bold> <gray>ʀɪɢʜᴛ ᴄʟɪᴄᴋ <dark_gray>» <red>-0.1"
        - ""
    back:
      material: BARRIER
      slot: 49
      name: "<gray>Back"
    add-line:
      material: BLAZE_POWDER
      slot: 50
      name: "<gold><bold>NEW LINE"
      lore:
        - ""
        - "<dark_gray><bold>|</bold> <gray>Lines <dark_gray>» <green><hologram-lines>/20"
        - ""
        - "<dark_gray><bold>|</bold> <gray>ʟᴇꜰᴛ ᴄʟɪᴄᴋ <dark_gray>» <white>ɴᴇᴡ ʟɪɴᴇ"
        - ""
    next-page:
      material: ARROW
      slot: 53
      name: "<gray>Next page"
      lore:
        - "<dark_gray>Page <page>/<pages>"

# Do not change this; it is used to add new options to your file automatically.
version: "1"
